name: Tests

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Install Emacs
                run: |
                    sudo apt-get update
                    sudo apt-get install --yes emacs-nox

            - name: Run checks
                run: make ci
